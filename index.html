<body>

    <div class="app-layout">
        <div class="control-panel">
            <div class="title">醉酒塔羅 🔮 偉特塔羅 × 雷諾曼 占卜系統</div>
            <div class="control-row">
                <div class="config-box">
                    <span>選擇牌陣:</span>
                    <select id="spreadSelect" onchange="toggleSpreadConfig()">
                        <option value="diary">🃏 塔羅日記 (單張)</option>
                        <option value="two">⚖️ 二擇一</option>
                        <option value="triangle">🔺 聖三角</option>
                        <option value="celtic5">✝️ 十字法 (五張)</option>
                        <option value="free">🎲 無牌陣</option>
                    </select>
                </div>

                <div class="config-box" id="freeConfigBox" style="display: none;" onclick="promptFreeCount()">
                    <span>張數:</span>
                    <span id="freeCountDisplay" style="color: #fff; font-weight: bold;">3</span>
                </div>

                <div class="config-box">
                    <span>雷諾曼:</span>
                    <select id="lenoCount">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>

                <button onclick="executeDraw()">✨ 抽牌</button>
            </div>
        </div>

        <div class="workspace">
            <div id="spreadArea" class="spread-container">
                <div class="welcome-box">
                    <div class="welcome-title">✨ 歡迎來到 偉特塔羅 × 雷諾曼 占卜系統 ✨</div>
                    <div class="welcome-subtitle">✨ 請點擊上方選單與按鈕開始進行占卜 ✨</div>
                    <div class="welcome-instructions">
                        <div class="welcome-instructions-title">使用方式：</div>
                        <div>1. 深呼吸三次，讓情緒平穩</div>
                        <div>2. 閉上眼，在心中想好問題</div>
                        <div>3. 於上方選單挑選牌陣與雷諾曼張數，按下「抽牌」</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="brand-footer">
        <span class="brand-name">醉酒塔羅 - 李特</span>
        <a href="https://www.threads.net/@tarot.drunk" target="_blank" class="brand-threads">@tarot.drunk</a>
    </div>

    <div class="visitor-counter-bar" id="visitorCount">
        🍸 載入訪客數中...
    </div>

    <div id="lenoModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">✨ 雷諾曼現實細節展開 ✨</div>
            <div id="modalBody" class="modal-body"></div>
            <button class="modal-close-btn" onclick="document.getElementById('lenoModal').style.display='none'">關閉視窗</button>
        </div>
    </div>

    <script>
        let customCount = 3;

        function promptFreeCount() {
            let input = prompt("請輸入自訂抽牌張數 (1 - 10)：", customCount);
            if (input !== null) {
                let val = parseInt(input);
                if (!isNaN(val) && val >= 1 && val <= 10) {
                    customCount = val;
                    document.getElementById("freeCountDisplay").textContent = customCount;
                } else {
                    alert("請輸入有效的數字 (1 到 10 之間)");
                }
            }
        }

        async function initCounter() {
            try {
                let endpoint = 'https://abacus.jasoncameron.dev/get/tarotdrunktw-png.github.io/tarot-visits';
                if (!sessionStorage.getItem('counted')) {
                    endpoint = 'https://abacus.jasoncameron.dev/hit/tarotdrunktw-png.github.io/tarot-visits';
                    sessionStorage.setItem('counted', 'true');
                }
                let response = await fetch(endpoint);
                let data = await response.json();
                document.getElementById('visitorCount').textContent = `🍸 歡迎來到醉酒塔羅，您是第：${data.value} 位深夜酒客`;
            } catch (e) {
                console.error("計數器載入失敗", e);
                document.getElementById('visitorCount').textContent = `🍸 歡迎來到醉酒塔羅`;
            }
        }

        initCounter();

        function toggleSpreadConfig() {
            let spreadVal = document.getElementById("spreadSelect").value;
            let freeBox = document.getElementById("freeConfigBox");
            if (spreadVal === "free") {
                freeBox.style.display = "flex";
            } else {
                freeBox.style.display = "none";
            }
        }

        function resetToHome() {
            let container = document.getElementById("spreadArea");

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomTarot(count) {
            let shuffled = shuffle(TAROT_DECK);
            let result = [];
            for(let i=0; i<count; i++) {
                let card = {...shuffled[i]};
                card.isReversed = Math.random() < 0.5;
                card.orientation = card.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
                card.interpretation = card.isReversed ? card.reversed : card.upright;
                result.push(card);
            }
            return result;
        }

        function getLenoBatch(shuffledLenoPool, count) {
            let batch = [];
            for(let i=0; i<count; i++) {
                if(shuffledLenoPool.length > 0) {
                    batch.push(shuffledLenoPool.pop());
                }
            }
            return batch;
        }

        function getBasePath() {
            let loc = window.location;
            if (loc.hostname.includes("github.io")) {
                let pathSegments = loc.pathname.split("/").filter(Boolean);
                if (pathSegments.length > 0) {
                    return "/" + pathSegments[0] + "/";
                }
            }
            return "./";
        }

        function createCardBoxHtml(card, lenoCards, posTitle) {
            let base = getBasePath();

            let badgeClass = card.isReversed ? "bg-rev" : "bg-up";
            let imgClass = card.isReversed ? "card-img reversed-img" : "card-img";
            
            let lenoHtml = "";
            if(lenoCards && lenoCards.length > 0) {
                let lenoDataStr = encodeURIComponent(JSON.stringify(lenoCards));
                lenoHtml = '<div class="leno-bar"><button class="leno-btn" onclick="openLenoModal(\'' + lenoDataStr + '\')">🔍 查看雷諾曼訊息 (共 ' + lenoCards.length + ' 張)</button></div>';
            }

            let html = '<div class="card-box">';
            if (posTitle) {
                html += '<div class="banner">' + posTitle + '</div>';
            }
            html += '<div class="content">';
            html += '<div class="tarot-frame">';

        function drawCeltic5() {

        function drawFreeSpread() {
            let count = customCount;
            let extCount = parseInt(document.getElementById("lenoCount").value) || 0;
            let tCards = getRandomTarot(count);
            let lenoPool = shuffle(LENORMAND_DECK);
            let container = document.getElementById("spreadArea");
            container.classList.add("is-wide");

            let html = `<h2 style="color:#f8fafc; margin-bottom:4px; text-align:center; width:100%;">【 🎲 無 牌 陣（ ${count} 張） 】</h2>`;
            html += '<div style="display:flex; flex-direction:column; gap:16px; width:100%; align-items:center;">';
            html += '<div style="font-size:13px; color:#38bdf8; font-weight:bold; margin-top:6px;">── 詳細牌意與解析 ──</div>';
            
            html += '<div class="branch-row" style="width:100%; max-width:1250px; gap: 16px;">';
            tCards.forEach((card, idx) => {
                html += '<div class="branch-col" style="min-width: 395px;">';
                html += createCardBoxHtml(card, getLenoBatch(lenoPool, extCount), `第 ${idx+1} 張牌`);
                html += '</div>';
            });
            html += '</div>';

            html += '<button class="reset-home-btn" onclick="resetToHome()">🔄 重新抽牌 (回到主頁面)</button>';
            html += '</div>';

            container.innerHTML = html;
        }
