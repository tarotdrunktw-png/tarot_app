<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偉特塔羅 × 復古雷諾曼 專業占卜系統</title>
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #151821;
            --card-bg: #1a1c24;
            --inner-bg: #13161f;
            --tarot-bg: #1a1e2b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #4338ca;
            --accent-hover: #6366f1;
            --upright: #2ecc71;
            --reversed: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* 控制面板 RWD */
        .control-panel {
            background-color: var(--panel-bg);
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222634;
            gap: 12px;
            text-align: center;
        }
        .title { font-size: 18px; font-weight: bold; color: #e4e6eb; width: 100%; }
        .btn-group { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        button, select, input {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .config-box { background: #1e2230; padding: 6px 10px; border-radius: 4px; border: 1px solid #33394d; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #38bdf8; flex-wrap: wrap; }
        input[type="number"] { width: 50px; background: #0d0f14; color: #fff; text-align: center; border: 1px solid #475569; padding: 4px; }

        /* 畫布 RWD */
        .workspace { flex: 1; padding: 16px; display: flex; justify-content: center; overflow-y: auto; width: 100%; }
        .spread-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

        /* 卡片外框 RWD：取消固定寬度，改用 max-width */
        .card-box {
            width: 100%;
            max-width: 450px;
            height: auto;
            min-height: 235px;
            background-color: var(--card-bg);
            border: 1px solid #2d3343;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 0 auto;
        }
        .banner {
            background-color: #232736;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 10px;
            text-align: center;
        }
        .content {
            background-color: var(--inner-bg);
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarot-frame {
            background-color: var(--tarot-bg);
            border: 1px solid #252b3d;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .t-head { font-size: 12px; font-weight: bold; color: #a5b4fc; margin-bottom: 6px; }
        .t-body { display: flex; gap: 10px; flex: 1; align-items: center; }
        .card-img { width: 70px; height: 115px; object-fit: cover; border: 1px solid #000; background: #1e2230; border-radius: 4px; flex-shrink: 0; }
        .t-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .card-name { font-size: 14px; font-weight: bold; color: var(--text-main); }
        .card-theme { font-size: 12px; color: var(--text-sub); }
        .interp-box { background: #242938; padding: 6px 8px; border-radius: 4px; font-size: 12px; color: #cbd5e1; margin-top: 2px; line-height: 1.4; }

        .footer-frame { display: flex; justify-content: center; margin-top: 4px; }
        .orientation-badge { font-size: 12px; font-weight: bold; color: #fff; padding: 4px 12px; border-radius: 4px; }
        .bg-up { background-color: var(--upright); }
        .bg-rev { background-color: var(--reversed); }

        .leno-bar { background: #161922; border: 1px solid #22293d; border-radius: 4px; padding: 4px; text-align: center; margin-top: 4px; }
        .leno-btn { background: #1e293b; color: #38bdf8; border: none; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .leno-btn:hover { background: #334155; color: #fff; }

        /* 牌陣佈局 RWD：手機版自動垂直堆疊 */
        .branch-row { display: flex; width: 100%; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .branch-col { display: flex; flex-direction: column; gap: 12px; align-items: center; flex: 1; min-width: 280px; }
        .branch-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 4px; text-align: center; }

        /* 彈出視窗 RWD */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-content { background: #1a1c24; width: 100%; max-width: 500px; max-height: 85vh; border-radius: 8px; border: 1px solid #333a4f; display: flex; flex-direction: column; overflow: hidden; padding: 16px; }
        .modal-header { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; text-align: center; }
        .modal-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .modal-card-item { background: #232736; border: 1px solid #2f364b; padding: 10px; border-radius: 6px; display: flex; gap: 12px; align-items: flex-start; }
        .modal-close-btn { margin-top: 12px; background: var(--accent); color: #fff; padding: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="title">🔮 偉特塔羅 × 復古雷諾曼 專業占卜系統</div>
        <div class="btn-group">
            <button onclick="drawTwoChoices()">⚖️ 二擇一牌陣</button>
            <button onclick="drawHolyTriangle()">🔺 聖三角牌陣</button>
            <div class="config-box">
                <span>無牌陣張數:</span>
                <input type="number" id="freeCount" value="3" min="1" max="10">
                <button onclick="drawFreeSpread()">自由抽牌</button>
            </div>
            <div class="config-box">
                <span>塔羅附帶雷諾曼:</span>
                <input type="number" id="lenoCount" value="1" min="0" max="3">
            </div>
        </div>
    </div>

    <div class="workspace">
        <div id="spreadArea" class="spread-container">
            <div style="color: var(--text-sub); margin-top: 100px; text-align: center; padding: 20px;">
                ✨ 請點擊上方按鈕開始進行專業占卜 ✨<br><br>
                (支援手機與電腦版自動排版)
            </div>
        </div>
    </div>

    <div id="lenoModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">✨ 雷諾曼現實細節展開 ✨</div>
            <div id="modalBody" class="modal-body"></div>
            <button class="modal-close-btn" onclick="document.getElementById('lenoModal').style.display='none'">關閉視窗</button>
        </div>
    </div>

    <script>
        const MAJOR_ARCANA = [

            {no: 1, name: "魔術師", en: "The Magician", theme: "靈性核心與大局走勢", upright: "創造力、技能、資源整合、主動顯化", reversed: "欺瞞、能力未發揮、心懷不軌、受挫", file: "RWS1909_-_01_Magician.jpeg"},
            {no: 2, name: "女祭司", en: "The High Priestess", theme: "靈性核心與大局走勢", upright: "直覺、潛意識、靜止觀察、神秘智慧", reversed: "壓抑情感、秘密洩漏、膚淺、忽視直覺", file: "RWS1909_-_02_High_Priestess.jpeg"},
            {no: 3, name: "皇后", en: "The Empress", theme: "靈性核心與大局走勢", upright: "豐盛、母性孕育、感官享受、自然創造", reversed: "過度保護、創造力停滯、依賴、浪費", file: "RWS1909_-_03_Empress.jpeg"},
            {no: 4, name: "皇帝", en: "The Emperor", theme: "靈性核心與大局走勢", upright: "權威、結構秩序、領導力、穩定控制", reversed: "專制暴政、缺乏紀律、固執僵化、失控", file: "RWS1909_-_04_Emperor.jpeg"},
            {no: 5, name: "教皇", en: "The Hierophant", theme: "靈性核心與大局走勢", upright: "傳統體制、精神導師、道德信念、尋求共識", reversed: "盲從體制、反叛叛逆、教條主義、虛偽", file: "RWS1909_-_05_Hierophant.jpeg"},
            {no: 6, name: "戀人", en: "The Lovers", theme: "靈性核心與大局走勢", upright: "愛與結合、價值觀抉擇、人際和諧", reversed: "關係裂痕、價值觀衝突、錯誤決定、誘惑", file: "RWS1909_-_06_Lovers.jpeg"},
            {no: 7, name: "戰車", en: "The Chariot", theme: "靈性核心與大局走勢", upright: "意志力、克服障礙、掌控方向、決心前進", reversed: "失控暴衝、方向迷失、挫敗、攻擊性過強", file: "RWS1909_-_07_Chariot.jpeg"},
            {no: 8, name: "力量", en: "The Strength", theme: "靈性核心與大局走勢", upright: "內在勇氣、耐心包容、以柔克剛、自信", reversed: "自我懷疑、軟弱無力、情緒失控、暴力", file: "RWS1909_-_08_Strength.jpeg"},
            {no: 9, name: "隱士", en: "The Hermit", theme: "靈性核心與大局走勢", upright: "內省探索、獨處沉澱、尋求真理、心靈指引", reversed: "孤立疏離、逃避現實、偏執盲目、寂寞", file: "RWS1909_-_09_Hermit.jpeg"},
            {no: 10, name: "命運之輪", en: "Wheel of Fortune", theme: "靈性核心與大局走勢", upright: "命運轉折、週期循環、幸運契機、不可抗力", reversed: "厄運連連、抗拒改變、週期停滯、意外挫折", file: "RWS1909_-_10_Wheel_of_Fortune.jpeg"},
            {no: 11, name: "正義", en: "Justice", theme: "靈性核心與大局走勢", upright: "公平正義、因果法則、客觀真相、明智裁決", reversed: "不公不義、偏見偏袒、逃避責任、法律糾紛", file: "RWS1909_-_11_Justice.jpeg"},
            {no: 12, name: "倒吊人", en: "The Hanged Man", theme: "靈性核心與大局走勢", upright: "換位思考、暫停放下、自我犧牲、獲得新視角", reversed: "無謂犧牲、停滯不前、抗拒放手、自怨自艾", file: "RWS1909_-_12_Hanged_Man.jpeg"},
            {no: 13, name: "死神", en: "Death", theme: "靈性核心與大局走勢", upright: "重大結束、必然轉化、掃除舊物、新階段開始", reversed: "抗拒改變、恐懼結束、痛苦拖延、停滯腐敗", file: "RWS1909_-_13_Death.jpeg"},
            {no: 14, name: "節制", en: "Temperance", theme: "靈性核心與大局走勢", upright: "平衡調和、耐心融合、適度自律、心靈療癒", reversed: "失衡失調、極端衝突、過度缺乏節制、急躁", file: "RWS1909_-_14_Temperance.jpeg"},
            {no: 15, name: "惡魔", en: "The Devil", theme: "靈性核心與大局走勢", upright: "物質束縛、執念誘惑、成癮依賴、陰暗面", reversed: "擺脫枷鎖、重獲自由、覺醒突破、認清陷阱", file: "RWS1909_-_15_Devil.jpeg"},
            {no: 16, name: "高塔", en: "The Tower", theme: "靈性核心與大局走勢", upright: "突發劇變、體系崩塌、幻象破滅、震撼啟蒙", reversed: "恐懼改變、避免災難、勉強支撐、餘震未平", file: "RWS1909_-_16_Tower.jpeg"},
            {no: 17, name: "星星", en: "The Star", theme: "靈性核心與大局走勢", upright: "希望指引、靈感湧現、寧靜信心、心靈療癒", reversed: "絕望灰心、失去信念、悲觀消極、靈感枯竭", file: "RWS1909_-_17_Star.jpeg"},
            {no: 18, name: "月亮", en: "The Moon", theme: "靈性核心與大局走勢", upright: "潛在恐懼、幻象焦慮、直覺波動、模糊不明", reversed: "迷霧消散、看清真相、釋放恐懼、情緒平復", file: "RWS1909_-_18_Moon.jpeg"},
            {no: 19, name: "太陽", en: "The Sun", theme: "靈性核心與大局走勢", upright: "成功喜悅、活力充沛、真理顯明、自信光明", reversed: "暫時低落、過度樂觀、虛榮自滿、延遲成功", file: "RWS1909_-_19_Sun.jpeg"},
            {no: 20, name: "審判", en: "The Judgement", theme: "靈性核心與大局走勢", upright: "生命召喚、重大覺醒、清算重獲新生、明智抉擇", reversed: "自我懷疑、逃避召喚、重複犯錯、悔恨內疚", file: "RWS1909_-_20_Judgement.jpeg"},
            {no: 21, name: "世界", en: "The World", theme: "靈性核心與大局走勢", upright: "圓滿達成、階段完成、完整合一、展翅高飛", reversed: "未竟之志、延宕拖延、缺乏收尾、受限束縛", file: "RWS1909_-_21_World.jpeg"}
        ];

        const LENORMAND_DECK = [
            {no: 1, name: "騎士", en: "Rider", file: "rider.avif", suit: "9♥", polarity: "正面", theme: "消息與行動", keywords: ["快速到來的消息", "新訪客", "行動力"]},
            {no: 2, name: "幸運草", en: "Clover", file: "clover.avif", suit: "6♦", polarity: "正面", theme: "短暫的幸運", keywords: ["小確幸", "意外轉機", "樂觀"]},
            {no: 3, name: "船", en: "Ship", file: "ship.avif", suit: "10♠", polarity: "正面", theme: "旅行與遠方", keywords: ["長途旅行", "海外發展", "轉變"]},
            {no: 4, name: "房子", en: "House", file: "house.avif", suit: "K♥", polarity: "正面", theme: "家庭與安定", keywords: ["家庭生活", "安全感", "不動產"]},
            {no: 5, name: "樹", en: "Tree", file: "tree.avif", suit: "7♥", polarity: "中性", theme: "健康與根基", keywords: ["身心健康", "長期成長", "耐力"]}
        ];

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomTarot(count) {
            let shuffled = shuffle(MAJOR_ARCANA);
            let result = [];
            for(let i=0; i<count; i++) {
                let card = {...shuffled[i]};
                card.isReversed = Math.random() < 0.5;
                card.orientation = card.isReversed ? "逆位 (Reversed)" : "正位 (Upright)";
                card.interpretation = card.isReversed ? card.reversed : card.upright;
                result.push(card);
            }
            return result;
        }

        function getRandomLeno(count) {
            let shuffled = shuffle(LENORMAND_DECK);
            return shuffled.slice(0, count);
        }

        function getBasePath() {
            let loc = window.location;
            if (loc.hostname.includes("github.io")) {
                let pathSegments = loc.pathname.split("/").filter(Boolean);
                if (pathSegments.length > 0) {
                    return "/" + pathSegments[0] + "/";
                }
            }
            return "./";
        }

        function createCardBoxHtml(card, lenoCards, posTitle) {
            let base = getBasePath();
            let imgPath = base + "rws1909/" + card.file;
            let badgeClass = card.isReversed ? "bg-rev" : "bg-up";
            
            let lenoHtml = "";
            if(lenoCards && lenoCards.length > 0) {
                let lenoDataStr = encodeURIComponent(JSON.stringify(lenoCards));
                lenoHtml = '<div class="leno-bar"><button class="leno-btn" onclick="openLenoModal(\'' + lenoDataStr + '\')">🔍 查看雷諾曼訊息 (共 ' + lenoCards.length + ' 張)</button></div>';
            }

            let html = '<div class="card-box">';
            if (posTitle) {
                html += '<div class="banner">' + posTitle + '</div>';
            }
            html += '<div class="content">';
            html += '<div class="tarot-frame">';
            html += '<div class="t-head">【塔羅主牌·大局/潛意識】</div>';
            html += '<div class="t-body">';
            html += '<img src="' + imgPath + '" class="card-img" onerror="this.style.display=\'none\'">';
            html += '<div class="t-info">';
            html += '<div class="card-name">' + card.name + ' (' + card.en + ')</div>';
            html += '<div class="card-theme">▸ 領域：' + card.theme + '</div>';
            html += '<div class="interp-box">▸ 意涵：' + card.interpretation + '</div>';
            html += '</div></div></div>';
            html += '<div class="footer-frame"><span class="orientation-badge ' + badgeClass + '">' + card.orientation + '</span></div>';
            html += lenoHtml;
            html += '</div></div>';
            return html;
        }

        function openLenoModal(encodedStr) {
            let cards = JSON.parse(decodeURIComponent(encodedStr));
            let base = getBasePath();
            let bodyHtml = "";
            let polColors = {"正面": "#2ecc71", "中性": "#f1c40f", "負面": "#e74c3c"};

            cards.forEach(function(c, idx) {
                let lImgPath = base + "lenormand/" + c.file;
                bodyHtml += '<div class="modal-card-item">';
                bodyHtml += '<div style="background:#000; padding:2px; border:1px solid #444; flex-shrink:0;">';
                bodyHtml += '<img src="' + lImgPath + '" style="width:60px; height:90px; object-fit:cover;" onerror="this.style.display=\'none\'">';
                bodyHtml += '</div>';
                bodyHtml += '<div style="flex:1; display:flex; flex-direction:column; gap:4px; font-size:12px;">';
                bodyHtml += '<div style="display:flex; justify-content:space-between; font-weight:bold; flex-wrap:wrap; gap:4px;">';
                bodyHtml += '<span>延伸牌 #' + (idx+1) + '：[' + String(c.no).padStart(2,'0') + '] ' + c.name + ' (' + c.en + ')</span>';
                bodyHtml += '<span style="background:' + polColors[c.polarity] + '; color:#000; padding:2px 6px; border-radius:3px; white-space:nowrap;">' + c.polarity + '</span>';
                bodyHtml += '</div>';
                bodyHtml += '<div style="color:#38bdf8;">▸ 撲克牌對應：' + c.suit + '</div>';
                bodyHtml += '<div style="color:#cbd5e1;">▸ 核心主題：' + c.theme + '</div>';
                bodyHtml += '<div style="color:#94a3b8;">▸ 現實顯化關鍵：' + c.keywords.join('、') + '</div>';
                bodyHtml += '</div></div>';
            });

            document.getElementById("modalBody").innerHTML = bodyHtml;
            document.getElementById("lenoModal").style.display = "flex";
        }

        function closeModal(e) {
            document.getElementById("lenoModal").style.display = "none";
        }

        function drawTwoChoices() {
            let extCount = parseInt(document.getElementById("lenoCount").value) || 1;
            let tCards = getRandomTarot(5);
            let area = document.getElementById("spreadArea");

            let html = '<h2 style="color:#f8fafc; margin-bottom:12px; text-align:center;">【 ⚖️ 二 擇 一 抉 擇 牌 陣 (上結下現) 】</h2>';
            html += '<div class="branch-row">';
            
            html += '<div class="branch-col">';
            html += '<div class="branch-title">── 選擇 A 路線 ──</div>';
            html += createCardBoxHtml(tCards[2], getRandomLeno(extCount), "【選擇 A · 結果】 最終結局與走向（上方）");
            html += createCardBoxHtml(tCards[1], getRandomLeno(extCount), "【選擇 A · 過程】 經歷狀態與挑戰（下方）");
            html += '</div>';

            html += '<div class="branch-col">';
            html += '<div class="branch-title">── 選擇 B 路線 ──</div>';
            html += createCardBoxHtml(tCards[4], getRandomLeno(extCount), "【選擇 B · 結果】 最終結局與走向（上方）");
            html += createCardBoxHtml(tCards[3], getRandomLeno(extCount), "【選擇 B · 過程】 經歷狀態與挑戰（下方）");
            html += '</div>';

            html += '</div>';
            html += '<div style="margin-top:16px; width:100%; max-width:450px;">';
            html += createCardBoxHtml(tCards[0], getRandomLeno(extCount), "【現狀核心】 當前處境與決策背景（底部）");
            html += '</div>';

            area.innerHTML = html;
        }

        function drawHolyTriangle() {
            let extCount = parseInt(document.getElementById("lenoCount").value) || 1;
            let tCards = getRandomTarot(3);
            let area = document.getElementById("spreadArea");

            let html = '<h2 style="color:#f8fafc; margin-bottom:12px; text-align:center;">【 🔺 聖 三 角 牌 陣 (金字塔結構) 】</h2>';
            html += '<div style="width:100%; max-width:450px; margin-bottom:16px;">';
            html += createCardBoxHtml(tCards[1], getRandomLeno(extCount), "【頂端核心·現在焦點】 當前處境與面臨的核心課題");
            html += '</div>';

            html += '<div class="branch-row">';
            html += '<div class="branch-col">' + createCardBoxHtml(tCards[0], getRandomLeno(extCount), "【左側基底·過去起因】 事情源頭與歷史根基") + '</div>';
            html += '<div class="branch-col">' + createCardBoxHtml(tCards[2], getRandomLeno(extCount), "【右側基底·未來趨勢】 依照現有軌跡發展的結局") + '</div>';
            html += '</div>';

            area.innerHTML = html;
        }

        function drawFreeSpread() {
            let count = parseInt(document.getElementById("freeCount").value) || 3;
            let extCount = parseInt(document.getElementById("lenoCount").value) || 1;
            let tCards = getRandomTarot(count);
            let area = document.getElementById("spreadArea");

            let html = '<h2 style="color:#f8fafc; margin-bottom:12px; text-align:center;">【 🎲 自 訂 無 牌 陣 （共 ' + count + ' 張塔羅） 】</h2>';
            // 手機版改用橫向滑動 (Scroll Snap) 來檢視多張牌
            html += '<div style="display:flex; gap:16px; overflow-x:auto; width:100%; padding-bottom:16px; scroll-snap-type: x mandatory;">';
            
            tCards.forEach(function(card, idx) {
                html += '<div style="min-width: 85vw; max-width: 450px; flex-shrink: 0; scroll-snap-align: center;">';
                html += createCardBoxHtml(card, getRandomLeno(extCount), '第 ' + (idx+1) + ' 張牌（自由焦點）');
                html += '</div>';
            });

            html += '</div>';
            area.innerHTML = html;
        }
    </script>
</body>
</html>
