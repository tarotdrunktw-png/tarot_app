<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醉酒塔羅 - 占卜系統</title>
    <link rel="icon" type="image/jpeg" href="tarot_drunk.jpg">
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: rgba(21, 24, 33, 0.85);
            --card-bg: rgba(26, 28, 36, 0.9);
            --inner-bg: rgba(19, 22, 31, 0.9);
            --tarot-bg: rgba(26, 30, 43, 0.9);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #4338ca;
            --accent-hover: #6366f1;
            --upright: #2ecc71;
            --reversed: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 90px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('daria-yakovleva-drink-6988494.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px) brightness(0.5);
            transform: scale(1.1);
            z-index: -999;
        }

        .control-panel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
            text-align: center;
        }
        .title { font-size: 18px; font-weight: bold; color: #e4e6eb; width: 100%; }
        .control-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        button, select, input {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        select { background-color: #0d0f14; border: 1px solid #475569; color: #fff; padding: 8px 12px; }
        
        .config-box { background: rgba(30, 34, 48, 0.8); padding: 6px 10px; border-radius: 4px; border: 1px solid #33394d; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #38bdf8; flex-wrap: wrap; }
        input[type="number"] { width: 50px; background: #0d0f14; color: #fff; text-align: center; border: 1px solid #475569; padding: 4px; }

        .workspace { flex: 1; padding: 16px; display: flex; justify-content: center; overflow-y: auto; width: 100%; }
        .spread-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

        .card-box {
            width: 100%;
            max-width: 450px;
            height: auto;
            min-height: 200px;
            background-color: var(--card-bg);
            border: 1px solid #2d3343;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        .banner {
            background-color: #232736;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 10px;
            text-align: center;
        }
        .content {
            background-color: var(--inner-bg);
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarot-frame {
            background-color: var(--tarot-bg);
            border: 1px solid #252b3d;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .t-head { font-size: 12px; font-weight: bold; color: #a5b4fc; margin-bottom: 6px; }
        .t-body { display: flex; gap: 10px; flex: 1; align-items: center; }
        
        .card-img { 
            width: 70px; 
            height: 115px; 
            object-fit: cover; 
            border: 1px solid #000; 
            background: #1e2230; 
            border-radius: 4px; 
            flex-shrink: 0; 
            transition: transform 0.3s ease;
        }
        .card-img.reversed-img {
            transform: rotate(180deg);
        }

        .t-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .card-name { font-size: 14px; font-weight: bold; color: var(--text-main); }
        .card-theme { font-size: 12px; color: var(--text-sub); }
        .interp-box { background: #242938; padding: 6px 8px; border-radius: 4px; font-size: 12px; color: #cbd5e1; margin-top: 2px; line-height: 1.4; }

        .footer-frame { display: flex; justify-content: center; margin-top: 4px; }
        .orientation-badge { font-size: 12px; font-weight: bold; color: #fff; padding: 4px 12px; border-radius: 4px; }
        .bg-up { background-color: var(--upright); }
        .bg-rev { background-color: var(--reversed); }

        .leno-bar { background: #161922; border: 1px solid #22293d; border-radius: 4px; padding: 4px; text-align: center; margin-top: 4px; }
        .leno-btn { background: #1e293b; color: #38bdf8; border: none; width: 100%; padding: 6px; font-size: 12px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        .leno-btn:hover { background: #334155; color: #fff; }

        .branch-row { display: flex; width: 100%; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .branch-col { display: flex; flex-direction: column; gap: 12px; align-items: center; flex: 1; min-width: 280px; }
        .branch-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 4px; text-align: center; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-content { background: #1a1c24; width: 100%; max-width: 500px; max-height: 85vh; border-radius: 8px; border: 1px solid #333a4f; display: flex; flex-direction: column; overflow: hidden; padding: 16px; }
        .modal-header { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; text-align: center; }
        .modal-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .modal-card-item { background: #232736; border: 1px solid #2f364b; padding: 10px; border-radius: 6px; display: flex; gap: 12px; align-items: flex-start; }
        .modal-close-btn { margin-top: 12px; background: var(--accent); color: #fff; padding: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }

        .brand-footer {
            position: fixed;
            bottom: 35px;
            right: 16px;
            background: rgba(21, 24, 33, 0.9);
            border: 1px solid #2f364b;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        .brand-name { font-weight: bold; color: #38bdf8; letter-spacing: 0.5px; }
        .brand-threads { color: #94a3b8; text-decoration: none; transition: color 0.2s; }
        .brand-threads:hover { color: #f8fafc; text-decoration: underline; }

        .visitor-counter {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 15, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            z-index: 998;
            letter-spacing: 0.5px;
        }
        .visitor-counter span {
            color: #38bdf8;
            font-weight: bold;
        }

        .welcome-box {
            color: var(--text-sub);
            margin-top: 80px;
            text-align: center;
            padding: 20px;
            line-height: 1.8;
        }
        .welcome-box p { margin-bottom: 12px; }
        .welcome-title { font-size: 16px; font-weight: bold; color: #e4e6eb; }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="title">醉酒塔羅 🔮 偉特塔羅 × 雷諾曼 占卜系統</div>
        <div class="control-row">
            <div class="config-box">
                <span>選擇牌陣:</span>
                <select id="spreadSelect" onchange="toggleSpreadConfig()">
                    <option value="diary">🃏 單張塔羅日記</option>
                    <option value="two">⚖️ 二擇一牌陣</option>
                    <option value="triangle">🔺 聖三角牌陣</option>
                    <option value="free">🎲 自訂無牌陣</option>
                </select>
            </div>

            <div class="config-box" id="freeConfigBox" style="display: none;">
                <span>張數:</span>
                <input type="number" id="freeCount" value="3" min="1" max="10">
            </div>

            <div class="config-box">
                <span>附帶雷諾曼:</span>
                <select id="lenoCount">
                    <option value="0" selected>0 張</option>
                    <option value="1">1 張</option>
                    <option value="2">2 張</option>
                    <option value="3">3 張</option>
                </select>
            </div>

            <button onclick="executeDraw()">✨ 開始占卜</button>
        </div>
    </div>

    <div class="workspace">
        <div id="spreadArea" class="spread-container">
            <div class="welcome-box">
                <p class="welcome-title">✨ 歡迎來到 偉特塔羅 × 雷諾曼 占卜系統 ✨</p>
                <p>✨ 請點擊上方選單與按鈕開始進行占卜 ✨</p>
                <p style="font-size: 16px; color: #64748b; margin-top: 15px;">使用方式：</p>
                <p style="font-size: 14px; color: #64748b;">1. 深呼吸三次，讓自己的情緒平穩</p>
                <p style="font-size: 14px; color: #64748b;">2. 閉上眼，在心中想好問題</p>
                <p style="font-size: 14px; color: #64748b;">3. 於上方選單挑選牌陣與雷諾曼張數，按下「開始占卜」</p>
            </div>
        </div>
    </div>

    <div class="brand-footer">
        <span class="brand-name">醉酒塔羅 - 李特</span>
        <a href="https://www.threads.net/@tarot.drunk" target="_blank" class="brand-threads">@tarot.drunk</a>
    </div>

    <div class="visitor-counter">
        🍸 歡迎使用，您是第：<span id="visitorNum">1050</span> 位深夜酒客
    </div>

    <div id="lenoModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">✨ 雷諾曼現實細節展開 ✨</div>
            <div id="modalBody" class="modal-body"></div>
            <button class="modal-close-btn" onclick="document.getElementById('lenoModal').style.display='none'">關閉視窗</button>
        </div>
    </div>

    <script>
        // 穩定流暢的計數防護：以 1050 為基準，在裝置內順暢累加，不再受外部 API 斷線影響
        window.addEventListener('DOMContentLoaded', () => {
            let count = localStorage.getItem('tarot_drunk_counter');
            if (!count) {
                count = 1050;
            } else {
                count = parseInt(count) + 1;
            }
            localStorage.setItem('tarot_drunk_counter', count);
            document.getElementById('visitorNum').innerText = count;
        });

        function toggleSpreadConfig() {
            let spreadVal = document.getElementById("spreadSelect").value;
            let freeBox = document.getElementById("freeConfigBox");
            if (spreadVal === "free") {
                freeBox.style.display = "flex";
            } else {
                freeBox.style.display = "none";
            }
        }

        function executeDraw() {
            let spreadVal = document.getElementById("spreadSelect").value;
            if (spreadVal === "diary") drawDailyDiary();
            else if (spreadVal === "two") drawTwoChoices();
            else if (spreadVal === "triangle") drawHolyTriangle();
            else if (spreadVal === "free") drawFreeSpread();
        }
